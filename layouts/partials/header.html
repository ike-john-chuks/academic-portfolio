<header class="site-header">
  <div class="site-header__inner">
    <a class="site-header__name" href="{{ "/" | relURL }}">{{ .Site.Params.author }}</a>
    <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav class="site-nav" id="site-nav" aria-label="Primary">
      {{ range .Site.Menus.main }}
      <a href="{{ .URL | relLangURL }}" {{ if $.IsMenuCurrent "main" . }}aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
